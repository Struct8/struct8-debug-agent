name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  gce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the program against a stand-in metadata server and Pub/Sub API
        run: sh gce/test/run.sh
      - name: The tag matches the version in the program
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^VERSION=//p' gce/struct8-debug.sh)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, program VERSION=$version"; exit 1; }
